# Netlify build & deploy configuration for Rentoule Projects
# Static site, no build step - publish repo root as-is

[build]
  publish = "."

# Previews must never be indexed. These commands run ONLY for deploy previews and
# branch deploys; production has no build command, so it never gets this header.
[context.deploy-preview]
  command = "printf '/*\\n  X-Robots-Tag: noindex, nofollow\\n' > _headers && cat _headers"

[context.branch-deploy]
  command = "printf '/*\\n  X-Robots-Tag: noindex, nofollow\\n' > _headers && cat _headers"

